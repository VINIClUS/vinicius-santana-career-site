- id: cnesdata
  order: 1
  title: CnesData
  eyebrow: Distributed health-data platform
  summary: >-
    A contract-led platform for moving municipal source extracts from edge environments into a tenant-isolated central data layer.
  brief:
    contribution: >-
      Built the edge-to-central path: Go extraction agent, manifest registration, central API and dashboard on shared generated contracts.
    decision: >-
      Generate contracts from source models and keep tenant context at the storage boundary, not only in application filters.
  technologies:
    - Python
    - FastAPI
    - Go
    - PostgreSQL
    - Parquet
    - Docker
    - React
  problem: >-
    Municipal source systems produce operational data at the edge, while reconciliation and downstream analysis need stable contracts, source provenance, and an explicit boundary between tenants.
  context: >-
    CnesData is developed as a public software platform. The repository demonstrates the application boundaries and local development path; this case study does not claim a municipal rollout, production scale, or processing results.
  contribution:
    - Defined canonical domain contracts and generated schemas shared by clients and services.
    - Built the Go edge-agent path for source extraction, compressed Parquet files, and manifest registration.
    - Implemented central API workflows for orchestration, device activation, access, and dashboard reads.
    - Kept tenant context explicit across authentication, persistence, and row-level isolation.
    - Developed the web dashboard around typed API contracts and operational state.
  architecture:
    - id: canonical-contracts
      title: Canonical contracts
      status: implemented
      description: Shared models and exported schemas establish one vocabulary for landing work, clients, and downstream services.
    - id: edge-agent
      title: Go edge agent
      status: implemented
      description: Edge extraction writes compressed Parquet artifacts and registers multi-file manifests with the central platform.
    - id: central-api
      title: Central API and manifests
      status: implemented
      description: A FastAPI service coordinates activation, extraction requests, manifest registration, and landing metadata.
    - id: tenant-isolation
      title: Tenant isolation
      status: implemented
      description: Tenant context is carried through authorization and PostgreSQL row-level security boundaries.
    - id: web-dashboard
      title: Web dashboard
      status: implemented
      description: The typed dashboard presents activation, agent state, access, and overview workflows.
    - id: parquet-to-gold
      title: Complete Parquet-to-Gold processing
      status: planned
      description: Worker foundations exist, but the full landing-to-Gold processing path is not presented as complete.
    - id: kubernetes
      title: Kubernetes deployment
      status: planned
      description: Kubernetes is a target deployment shape rather than a published production claim.
  decisions:
    - problem: "Hand-written JSON Schema and OpenAPI contracts drift from the Pydantic models that actually define the data."
      decision: "Generate the JSON Schema and OpenAPI contracts from the shared Pydantic models instead of maintaining them by hand."
      evidenceUrl: https://github.com/VINIClUS/CnesData/blob/main/scripts/gen_contracts.py
    - problem: "Multi-source ingestion must distinguish a complete extraction from a partial or inconsistent set of uploaded files."
      decision: "Give every file a raw manifest (source, competência, snapshot mode, SHA-256) and register the full set as one extraction unit."
      evidenceUrl: https://github.com/VINIClUS/CnesData/blob/main/docs/contracts/schemas/raw_manifest.json
    - problem: "A shared multi-tenant database cannot depend on every query remembering to filter by tenant."
      decision: "Set the tenant as a transaction-local PostgreSQL setting and enforce it with row-level security policies."
      evidenceUrl: https://github.com/VINIClUS/CnesData/blob/main/packages/cnes_infra/src/cnes_infra/storage/rls.py
  reliability:
    - Contract and OpenAPI artifacts can be regenerated from source models and checked for drift.
    - Landing work has explicit states and ownership boundaries so incomplete processing is visible.
    - Local development composes the API, object storage, identity provider, database, agent, and dashboard without implying production deployment.
    - Keep audit-rule execution outside this repository and expose stable data contracts for downstream consumers.
  outcomes:
    - The public implementation provides a coherent path from edge extraction to tenant-scoped landing records.
    - Shared contracts make incomplete and planned portions visible instead of hiding them behind broad platform claims.
  limitations:
    - Full Parquet-to-Gold processing remains planned and is not described as complete.
    - Kubernetes remains a target deployment model; this page makes no production availability or scale claim.
    - No municipal records, health data, or quantitative operational results are published here.
  evidence:
    - label: CnesData public repository
      status: implemented
      url: https://github.com/VINIClUS/CnesData
      description: Source code, contracts, application boundaries, tests, and current-status documentation.
    - label: Architecture documentation
      status: documented
      url: https://github.com/VINIClUS/CnesData/blob/main/docs/architecture.md
      description: Public system model and service-boundary reference.

- id: limnopulse
  order: 2
  title: Limnopulse
  eyebrow: Tenant-scoped telemetry and alerting
  summary: >-
    An API and evaluation runtime for authorized telemetry reads, alert rules, durable incidents, and notification delivery.
  brief:
    contribution: >-
      Built tenant-scoped telemetry access, versioned alert rules, a replayable Go evaluator and separate email/Telegram delivery.
    decision: >-
      Treat durable domain state as the authority and queues as at-least-once transports, with a one-shot evaluator so replay stays observable.
  technologies:
    - Python
    - FastAPI
    - Go
    - DynamoDB
    - InfluxDB
    - SQS
    - OpenTofu
  problem: >-
    Telemetry becomes operationally useful only when access, alert evaluation, incident state, and notification delivery remain attributable to the correct tenant and device context.
  context: >-
    Limnopulse is a software implementation with local integration scaffolding and a separately documented cloud-infrastructure path. Its device and broker examples are development contracts, not evidence of a deployed sensor fleet.
  contribution:
    - Implemented tenant membership checks and pond ownership checks around telemetry reads.
    - Built versioned rule configuration, durable alert events, and role-aware incident transitions.
    - Developed a one-shot Go evaluator with explicit replay and work-ownership behavior.
    - Separated email and Telegram notification queues, workers, bindings, and delivery state.
    - Documented cloud resources and operational prerequisites with OpenTofu modules.
  architecture:
    - id: telemetry-api
      title: Tenant-scoped telemetry API
      status: implemented
      description: FastAPI authorizes membership and resource ownership before querying time-series readings.
    - id: alert-rules
      title: Rules and durable alert events
      status: implemented
      description: Versioned rules guide evaluation; DynamoDB stores durable alert events and outboxes for opening, acknowledgement, resolution, and recovery workflows.
    - id: evaluator
      title: One-shot evaluator
      status: implemented
      description: A Go runtime queries reading windows in InfluxDB, evaluates owned work once per call, and persists events and outboxes in DynamoDB before exiting. Scheduling remains external.
    - id: notifications
      title: Notification delivery
      status: implemented
      description: An outbox relay publishes per-channel work to SQS. Separate email and Telegram queues and workers preserve authoritative delivery, attempt, and idempotency state.
    - id: mqtt-ingestion
      title: Local MQTT ingestion
      status: implemented
      description: MQTT, Telegraf, and sample publishers write readings to InfluxDB in a loopback-only local ingestion scaffold.
    - id: cloud-infrastructure
      title: Cloud infrastructure path
      status: documented
      description: OpenTofu describes the intended managed resources and their operational prerequisites.
    - id: production-device-layer
      title: Production device and broker layer
      status: planned
      description: A hardened broker, device credentials, fleet operations, and production sensor hardware remain outside the verified implementation.
  decisions:
    - problem: "A long-lived evaluator carries idle overhead and failure state from one check cycle into the next."
      decision: "Run the alert evaluator as a one-shot process per cycle and leave scheduling, retries and backfill to an external scheduler."
      evidenceUrl: https://github.com/VINIClUS/limnopulse/blob/main/docs/architecture.md
    - problem: "Asynchronous consumers need durable backpressure and retry isolation without reimplementing an event bus."
      decision: "Treat SQS with dead-letter queues as the durable work boundary and keep domain state correct under at-least-once, out-of-order delivery."
      evidenceUrl: https://github.com/VINIClUS/limnopulse/blob/main/docs/adr/ADR-016-eventbridge-is-selective-sqs-is-durable.md
    - problem: "Telegram and email have different limits, credentials and failure modes; a shared path lets one channel degrade the other."
      decision: "Give Telegram its own queue, dead-letter queue, worker and least-privilege IAM policy, isolated from email delivery."
      evidenceUrl: https://github.com/VINIClUS/limnopulse/blob/main/tests/unit/test_phase3cb_telegram_boundaries.py
  reliability:
    - Optimistic versions and idempotency keys make conflicting rule changes and replacement replays explicit.
    - Durable outboxes connect alert transitions to notification work without treating queue delivery as authoritative state.
    - Local fakes and emulators exercise integration boundaries without being represented as hosted services.
    - Telemetry is authorized through the API, so clients never receive direct time-series database access.
  outcomes:
    - The implementation connects authorized readings, configurable rules, durable incidents, and delivery workers through explicit tenant boundaries.
    - Channel isolation and replay-oriented operations make failure modes inspectable in code and documentation.
  limitations:
    - No production sensor fleet or hardware deployment is verified.
    - MQTT ingestion is demonstrated only as a local scaffold; production broker TLS, device credentials, and access controls remain planned.
    - Cloud infrastructure is documented as code, but this page does not claim a live hosted environment or notification volume.
  evidence:
    - label: Limnopulse public repository
      status: implemented
      url: https://github.com/VINIClUS/limnopulse
      description: Public API, evaluator, notification workers, local integration scaffolding, and tests.
    - label: Alert evaluator operations
      status: documented
      url: https://github.com/VINIClUS/limnopulse/blob/main/docs/alert-evaluator-phase-3b.md
      description: Public replay, sharding, scheduling, and failure-handling contract.
    - label: Notification operations
      status: documented
      url: https://github.com/VINIClUS/limnopulse/blob/main/docs/notifications-phase-3c-a.md
      description: Public delivery-state, retry, rollout, and recovery documentation.

    - label: Limnopulse architecture
      status: documented
      url: https://github.com/VINIClUS/limnopulse/blob/main/docs/architecture.md
      description: Public boundaries for authorized telemetry, one-shot evaluation, durable events, outbox relays, and channel-specific notification work.
    - label: Telegram notification operations
      status: documented
      url: https://github.com/VINIClUS/limnopulse/blob/main/docs/notifications-phase-3c-b.md
      description: Public Telegram binding, worker, delivery-state, and retry contracts, separated from email delivery.

- id: infrastructure
  order: 3
  title: Infrastructure & Operations
  eyebrow: Reusable automation and operational contracts
  summary: >-
    Public infrastructure work that separates reusable automation, image-building, and system runbooks from private runtime configuration.
  brief:
    contribution: >-
      Wrote reusable Ansible roles, Packer image templates with validation, and e-SUS PEC bootstrap runbooks.
    decision: >-
      Separate generic infrastructure contracts from system-specific bootstraps and rebuild images through Packer instead of manual changes.
  technologies:
    - Ansible
    - Packer
    - Proxmox VE
    - Python
    - PowerShell
    - Bash
    - Docker
  problem: >-
    Infrastructure work needs repeatable baselines, image builds, validations, and recovery documentation without publishing the runtime details that identify real environments.
  context: >-
    This case study combines only public evidence from three repositories. Its system view is a sanitized, illustrative reference topology, not a production inventory or a map of any real environment.
  contribution:
    - Defined reusable Ansible roles and playbook contracts for server baselines, access hardening, firewall, backup, monitoring, and provisioning concerns.
    - Built repeatable Packer templates and validation routines for Linux and Windows image families.
    - Organized e-SUS PEC automation, validators, and operational runbooks in a dedicated lifecycle boundary.
    - Kept public examples separate from runtime inventory, credentials, endpoints, and environment state.
  architecture:
    - id: ansible-contracts
      title: Reusable Ansible contracts
      status: implemented
      description: Generic roles, playbooks, example inputs, and validators define the shareable automation boundary.
    - id: image-builds
      title: Reproducible image builds
      status: implemented
      description: Packer definitions and supporting scripts establish repeatable Linux and Windows template workflows.
    - id: operations-automation
      title: System-specific operational automation
      status: implemented
      description: Dedicated scripts, validators, and runbooks keep application operations separate from base-image lifecycle work.
    - id: reference-topology
      title: Reference topology
      status: illustrative
      description: The relationship among automation control, image building, target systems, monitoring, and backup is deliberately generalized.
  decisions:
    - problem: "Generic server operations and system-specific bootstraps change at different rates and couple unrelated work when kept together."
      decision: "Scope infra-ansible to reusable Ansible code; inventory, secrets, image builds and each bootstrap live in their own repositories, consumed by pinned ref."
      evidenceUrl: https://github.com/VINIClUS/infra-ansible/blob/main/docs/architecture.md
    - problem: "Hand-edited VM templates make it hard to know what changed between images or to reproduce one exactly."
      decision: "Define templates as code and rebuild them: Packer HCL2 for Windows, versioned import scripts from official cloud images for Linux."
      evidenceUrl: https://github.com/VINIClUS/packer-proxmox-templates/blob/main/README.md
    - problem: "An operational script without a runbook or example configuration becomes unclear about what it changes and what it depends on."
      decision: "Ship each operational script with a paired runbook and example configuration, and statically check that all three are present."
      evidenceUrl: https://github.com/VINIClUS/esus-pec-bootstrap/blob/main/tests/Validate-EsusPecWalGBackupsDocs.ps1
  reliability:
    - Static validation, syntax checks, and preflight scripts provide cheap feedback before infrastructure code reaches a target.
    - Runbooks cover prerequisites, verification, rollback, and evidence expectations for operational changes.
    - Backup and monitoring concerns are represented as reusable contracts without exposing live destinations or endpoints.
    - Examples and interfaces are published while all environment-specific configuration stays outside the portfolio content.
  outcomes:
    - The public repositories demonstrate repeatable infrastructure practices across configuration, image, and application-operation layers.
    - Explicit repository boundaries reduce duplication and make ownership of automation and documentation clearer.
  limitations:
    - The topology is illustrative and cannot be used to infer a real deployment, inventory, network, or secret layout.
    - Public evidence demonstrates reusable contracts and workflows, not the current state or availability of any target system.
    - No private repository names, IP addresses, hostnames, credential locations, or real operational identifiers are included.
  evidence:
    - label: infra-ansible public repository
      status: implemented
      url: https://github.com/VINIClUS/infra-ansible
      description: Generic Ansible roles, playbooks, examples, validation, and public scope boundaries.
    - label: packer-proxmox-templates public repository
      status: implemented
      url: https://github.com/VINIClUS/packer-proxmox-templates
      description: Packer definitions, image-build scripts, validation, and public operational documentation.
    - label: esus-pec-bootstrap public repository
      status: implemented
      url: https://github.com/VINIClUS/esus-pec-bootstrap
      description: System-specific automation, validators, and public runbooks for application operations.

- id: esusdata
  order: 4
  title: Esusdata
  eyebrow: Observatório APS · local primary-care observatory
  summary: >-
    A local, read-only path from e-SUS PEC acquisition to verifiable extracts and versioned primary-care indicators, with publication controlled by evidence and methodology.
  brief:
    contribution: >-
      Built a bounded Rust acquisition plane, a reproducible C1 calculation, and Java/SQLite coordination for authorization and staged publication.
    decision: >-
      Keep the PEC immutable and stage technical results apart from publication, which needs both evidence and methodological approval.
  technologies:
    - Java 21
    - Spring Boot
    - Rust
    - SQLite
    - React
    - PostgreSQL
  problem: >-
    A primary-care indicator needs reproducible source counts and a clear authorization boundary. A technically successful calculation cannot become an official result while its methodological interpretation remains unvalidated.
  context: >-
    The public repository implements a local service with its own SQLite store, a Rust child process for bounded PEC reads and extract generation, and a Java indicator and result path. It describes tests against specific PEC versions; this page does not display municipal data or imply that the C1 methodology has been released.
  contribution:
    - Separated the PEC read-only source from the local service and kept acquisition inside an ephemeral Rust execution plane.
    - Implemented bounded acquisition, extract validation, hashes, manifests, and reproducible calculation without reconnecting to the PEC.
    - Built local Java/SQLite coordination for runs, authorization, result staging, evidence, and controlled publication.
    - Encoded the C1 Mais Acesso rule while recording unresolved methodological gates rather than presenting it as an approved indicator.
    - Developed an authorized web client for local results and scope-aware access.
  architecture:
    - id: pec-source
      title: PEC source boundary
      status: implemented
      description: The municipal PEC remains a separate PostgreSQL source, accessed with a read-only identity and no application writes.
    - id: execution-plane
      title: Rust execution plane
      status: implemented
      description: An ephemeral child process probes source compatibility, enforces read budgets, streams rows, and creates the extract data file.
    - id: verified-extract
      title: Verifiable extract
      status: implemented
      description: Local data files, record validation, byte limits, checksums, and manifests make calculation repeatable after the PEC connection closes.
    - id: local-coordination
      title: Java and SQLite coordination
      status: implemented
      description: One local service owns run state, locking, grants, manifest reconciliation, and atomic result publication in its own SQLite store.
    - id: c1-rule
      title: C1 Mais Acesso rule
      status: implemented
      description: The pure Java rule computes a versioned technical candidate. Methodological validation is still required before treating C1 as a released indicator.
    - id: results
      title: Conditional result publication
      status: implemented
      description: Staging, evidence, history, and an atomic publication path exist; real C1 publication remains blocked by incomplete methodological gates.
    - id: authorized-dashboard
      title: Authorized dashboard
      status: implemented
      description: The local web client requests scoped results through the service; municipal grants constrain aggregate result access.
  decisions:
    - problem: "A live PEC read can hang or misbehave inside the process that owns the job queue and calculation."
      decision: "Run live acquisition in an ephemeral Rust child process per job, with its own fault and resource boundary, while Java keeps the queue and calculation."
      evidenceUrl: https://github.com/VINIClUS/esusdata/blob/c879dff09adc41d8c2d8f0baa472fa3c0bba0489/docs/adr/0010-plano-de-execucao-fora-do-processo.md
    - problem: "Recomputing or verifying a past result would otherwise require reconnecting to a PEC that may be unreachable or changed."
      decision: "Treat a finalized extract and its checksummed manifest as a self-contained input, and reject anything with a missing or mismatched manifest."
      evidenceUrl: https://github.com/VINIClUS/esusdata/blob/c879dff09adc41d8c2d8f0baa472fa3c0bba0489/apps/agent/src/main/java/esusdata/run/extract/ExtractReader.java
    - problem: "Access can be revoked after the first authorization check of a job but before acquisition or publication runs."
      decision: "Revalidate the grant of the requesting user before acquisition and again before publication, so a revoked account stops the next step without erasing history."
      evidenceUrl: https://github.com/VINIClUS/esusdata/blob/c879dff09adc41d8c2d8f0baa472fa3c0bba0489/apps/agent/src/main/java/esusdata/auth/GrantRevalidator.java
  reliability:
    - Source compatibility and read budgets fail closed before an unbounded or mismatched acquisition can become a result.
    - Extract validation and checksums protect the calculation from partial or modified local files.
    - Local tests and documented PEC-version checks exercise acquisition and recomputation; they do not substitute for methodological sign-off.
    - Technical results are staged separately from publication, which requires both evidence and methodological approval.
  outcomes:
    - The public code connects source diagnosis, bounded acquisition, verifiable local extracts, indicator calculation, and scoped result access.
    - The illustrative 3 scheduled and 2 walk-in encounters yield 60% / Ótimo only in a hypothetical target flow with all gates completed.
  limitations:
    - Real C1 publication remains blocked while methodological source, interpretation, review, and approval gates are incomplete.
    - The six-chapter tour uses fictional counts and a hypothetical approved target. It is not a patient record, production result, or claim of current C1 release.
    - Public tests against documented PEC versions do not establish compatibility with every installation or a live deployment shown in this portfolio.
  evidence:
    - label: Esusdata public repository
      status: implemented
      url: https://github.com/VINIClUS/esusdata/tree/c879dff09adc41d8c2d8f0baa472fa3c0bba0489
      description: Pinned source for the Rust execution plane, Java/SQLite service, web client, tests, and current README.
    - label: C1 methodology and implementation status
      status: documented
      url: https://github.com/VINIClUS/esusdata/blob/c879dff09adc41d8c2d8f0baa472fa3c0bba0489/docs/RELATORIO_FINAL_2026-09-19.md
      description: Documents the technical C1 proof and the methodological gates that still block release.
    - label: PEC compatibility evidence
      status: documented
      url: https://github.com/VINIClUS/esusdata/blob/c879dff09adc41d8c2d8f0baa472fa3c0bba0489/docs/discovery/2026-09-24-pec-5528.md
      description: Version-specific acquisition and differential-check evidence; not a blanket compatibility claim.
